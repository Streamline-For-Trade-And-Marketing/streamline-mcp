<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.6 4.6 38.7 61" width="387" height="610" color="#FFFFFF" role="img" aria-label="Streamline">
<title>Streamline</title>
<style>
.slm-f{fill:currentColor}
.slm-r,.slm-k,.slm-s{fill:none;stroke:currentColor;stroke-dasharray:101 101;stroke-dashoffset:101}
.slm-r{stroke-width:4.2;animation:slm-d .5s cubic-bezier(.6,.05,.35,1) both}
.slm-k{stroke-width:2.2;animation:slm-d .3s cubic-bezier(.4,0,.2,1) .34s both}
.slm-s{stroke-width:21;stroke-linecap:round;animation:slm-d .95s cubic-bezier(.6,0,.3,1) .42s both}
.slm-c,.slm-p,.slm-m{transform-origin:0 0}
.slm-c{animation:slm-c .4s cubic-bezier(.3,0,.3,1) .6s both}
.slm-p{animation:slm-p .56s linear 1.16s both}
.slm-a{animation:slm-off 1ms linear 1.74s both}
.slm-o{animation:slm-on 1ms linear 1.74s both}
@keyframes slm-d{to{stroke-dashoffset:0}}
@keyframes slm-c{45%{transform:scale(1.07)}}
@keyframes slm-p{0%{transform:scale(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}55%{transform:scale(1.06);animation-timing-function:cubic-bezier(.4,0,.6,1)}80%{transform:scale(.985);animation-timing-function:cubic-bezier(.4,0,.6,1)}100%{transform:scale(1)}}
@keyframes slm-on{from{opacity:0}to{opacity:1}}
@keyframes slm-off{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.slm-a{display:none}.slm-o{animation:none}}
</style>
